<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración de Precios</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .admin-box { background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 350px; }
        h2 { text-align: center; color: #ff9800; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #ff9800; color: #121212; border: none; padding: 12px; margin-top: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e68900; }
        #panel-contenido { display: none; }
    </style>
</head>
<body>

    <div class="admin-box">
        <!-- Bloque de Contraseña -->
        <div id="login-box">
            <h2>Acceso Restringido</h2>
            <label>Ingresa tu contraseña:</label>
            <input type="password" id="input-password" placeholder="Contraseña">
            <button onclick="verificarPassword()">Entrar</button>
        </div>

        <!-- Panel de Ajustes (Se abre solo si pones la contraseña bien) -->
        <div id="panel-contenido">
            <h2>Gestor de Precios</h2>
            
            <label for="select-linea">Selecciona a qué aplicarlo:</label>
            <select id="select-linea">
                <option value="todos">Todos los productos (Global)</option>
                <option value="linea-eurostil">Línea Eurostil (Detectado por nombre)</option>
                <option value="linea-Victa">Línea Victa (Detectado por nombre)</option>
                <option value="linea-novalook">Línea novalook (Detectado por nombre)</option>
                <option value="linea-nov">Línea nov (Detectado por nombre)</option>
                <option value="linea-iyosei">Línea iyosei (Detectado por nombre)</option>
                <option value="linea-gianna-b">Línea gianna-b (Detectado por nombre)</option>
                <option value="linea-skala">Línea skala (Detectado por nombre)</option>
                <option value="linea-bekim">Línea bekim (Detectado por nombre)</option>
                <option value="linea-vella">Línea vella (Detectado por nombre)</option>
                <option value="linea-general">Línea General / Resto</option>
            </select>

            <label for="input-porcentaje">Porcentaje (+ o -):</label>
            <input type="number" id="input-porcentaje" placeholder="Ej: 10 (para subir 10%) o -5 (para bajar)">

            <button onclick="guardarAjustePrecios()">Aplicar Cambios</button>
            <button onclick="resetearPrecios()" style="background: #d32f2f; color: white; margin-top: 10px;">Restaurar Precios Originales</button>
        </div>
    </div>

    <script>
        // AQUÍ PUEDES CAMBIAR TU CONTRASEÑA POR LA QUE QUIERAS
        const CLAVE_SECRETA = "5177"; 

        function verificarPassword() {
            let pass = document.getElementById("input-password").value;
            if (pass === CLAVE_SECRETA) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("panel-contenido").style.display = "block";
            } else {
                alert("Contraseña incorrecta");
            }
        }

      function guardarAjustePrecios() {
            let lineaSeleccionada = document.getElementById("select-linea").value;
            let porcentaje = parseFloat(document.getElementById("input-porcentaje").value);

            if (isNaN(porcentaje)) {
                alert("Por favor ingresa un número de porcentaje válido (ej: 10 o -5).");
                return;
            }

            // 1. Tomamos la base de precios actual (si ya fue modificada antes, usa esa; si es primera vez, usa la original de la tienda)
            let baseDatosPrecios = JSON.parse(localStorage.getItem("preciosPermanentes")) || productosPorCategoria;

            // 2. Recorremos las categorías y aplicamos el porcentaje de forma acumulativa sobre el precio actual
            for (let categoria in baseDatosPrecios) {
                let esCategoriaAfectada = (lineaSeleccionada === "todos" || lineaSeleccionada === "linea-" + categoria.toLowerCase());

                if (esCategoriaAfectada) {
                    baseDatosPrecios[categoria].forEach(prod => {
                        let nuevoPrecio = prod.precio * (1 + (porcentaje / 100));
                        prod.precio = Number(nuevoPrecio.toFixed(3));
                    });
                }
            }

            // 3. Guardamos los nuevos precios como definitivos en el navegador
            localStorage.setItem("preciosPermanentes", JSON.stringify(baseDatosPrecios));
            alert("¡Precios actualizados y acumulados con éxito! Ya se reflejan en tu tienda principal.");
        }

        function resetearPrecios() {
            if (confirm("¿Estás seguro de querer borrar todos los aumentos acumulados y volver a los precios originales de tu código?")) {
                localStorage.removeItem("preciosPermanentes");
                alert("Precios restaurados a la normalidad.");
            }
        }
    </script>
</body>
</html>
