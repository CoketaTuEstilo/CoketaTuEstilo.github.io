<!DOCTYPE html>

    <meta charset="UTF-8">
    <title>Panel de Administración de Precios</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-box { background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 400px; }
        h2 { text-align: center; color: #ff9800; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        select, input { width: 100%; padding: 10px; margin-top: 5px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background: #ff9800; color: #121212; border: none; padding: 12px; margin-top: 20px; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #e68900; }
        #panel-contenido { display: none; }
    </style>
</head>

    <div class="admin-box">
        <!-- Bloque de Contraseña -->
        <div id="login-box">
            <h2>Acceso Restringido</h2>
            <label>Ingresa tu contraseña:</label>
            <input type="password" id="input-password" placeholder="Contraseña">
            <button onclick="verificarPassword()">Entrar</button>
        </div>

        <!-- Panel de Ajustes -->
        <div id="panel-contenido">
            <h2>Gestor de Precios</h2>
            
            <label for="select-linea">¿A qué aplicar el cambio?</label>
            <select id="select-linea" onchange="cambiarModoSeleccion()">
                <option value="todos">Todos los productos (Global)</option>
                <option value="linea-eurostil">Línea Eurostil (Línea entera)</option>
                <option value="linea-Victa">Línea Victa (Línea entera)</option>
                <option value="linea-novalook">Línea novalook (Línea entera)</option>
                <option value="linea-nov">Línea nov (Línea entera)</option>
                <option value="linea-iyosei">Línea iyosei (Línea entera)</option>
                <option value="linea-gianna-b">Línea gianna-b (Línea entera)</option>
                <option value="linea-skala">Línea skala (Línea entera)</option>
                <option value="linea-bekim">Línea bekim (Línea entera)</option>
                <option value="linea-vella">Línea vella (Línea entera)</option>
                <option value="linea-general">Línea General / Resto</option>
                <option value="individual">Un solo producto específico</option>
            </select>

            <div id="bloque-producto-individual" style="display: none;">
                <label for="select-producto">Elige el producto:</label>
                <select id="select-producto">
                    <!-- Se llena con JavaScript -->
                </select>
            </div>

            <label for="input-porcentaje">Porcentaje (+ o -):</label>
            <input type="number" id="input-porcentaje" placeholder="Ej: 10 (subir 10%) o -5 (bajar)">

            <button onclick="guardarAjustePrecios()">Aplicar Cambios</button>
            <button onclick="resetearPrecios()" style="background: #d32f2f; color: white; margin-top: 10px;">Restaurar Precios Originales</button>
        </div>
    </div>

        // Función auxiliar para obtener la base de datos actual o el respaldo por defecto
        function obtenerBaseDatos() {
            try {
                let datosGuardados = localStorage.getItem("preciosPermanentes");
                if (datosGuardados) {
                    return JSON.parse(datosGuardados);
                }
            } catch (e) {
                console.error("Error leyendo localStorage, usando respaldo");
            }
            return productosOriginalesAdmin;
        }

        function verificarPassword() {
            let pass = document.getElementById("input-password").value;
            if (pass === CLAVE_SECRETA) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("panel-contenido").style.display = "block";
                cargarListaProductosIndividuales();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function cambiarModoSeleccion() {
            let seleccion = document.getElementById("select-linea").value;
            let bloqueIndividual = document.getElementById("bloque-producto-individual");
            if (seleccion === "individual") {
                bloqueIndividual.style.display = "block";
            } else {
                bloqueIndividual.style.display = "none";
            }
        }

        function cargarListaProductosIndividuales() {
            let selectProd = document.getElementById("select-producto");
            selectProd.innerHTML = "";
            let baseDatosPrecios = obtenerBaseDatos();

            for (let categoria in baseDatosPrecios) {
                if (Array.isArray(baseDatosPrecios[categoria])) {
                    baseDatosPrecios[categoria].forEach(prod => {
                        let option = document.createElement("option");
                        option.value = prod.id;
                        option.textContent = `[${categoria}] ${prod.nombre} (Actual: $${prod.precio})`;
                        selectProd.appendChild(option);
                    });
                }
            }
        }

        function guardarAjustePrecios() {
            let modo = document.getElementById("select-linea").value;
            let porcentaje = parseFloat(document.getElementById("input-porcentaje").value);

            if (isNaN(porcentaje)) {
                alert("Por favor ingresa un número de porcentaje válido (ej: 10 o -5).");
                return;
            }

            let baseDatosPrecios = obtenerBaseDatos();

            if (modo === "individual") {
                let idBuscado = parseInt(document.getElementById("select-producto").value);
                let encontrado = false;

                for (let categoria in baseDatosPrecios) {
                    baseDatosPrecios[categoria].forEach(prod => {
                        if (prod.id === idBuscado) {
                            let nuevoPrecio = prod.precio * (1 + (porcentaje / 100));
                            prod.precio = Number(nuevoPrecio.toFixed(3));
                            encontrado = true;
                        }
                    });
                }
                if (encontrado) {
                    alert("¡Precio del producto individual actualizado con éxito!");
                }
            } else {
                for (let categoria in baseDatosPrecios) {
                    let esCategoriaAfectada = (modo === "todos" || modo === "linea-" + categoria.toLowerCase());

                    if (esCategoriaAfectada) {
                        baseDatosPrecios[categoria].forEach(prod => {
                            let nuevoPrecio = prod.precio * (1 + (porcentaje / 100));
                            prod.precio = Number(nuevoPrecio.toFixed(3));
                        });
                    }
                }
                alert("¡Precios de la línea/global actualizados con éxito!");
            }

            localStorage.setItem("preciosPermanentes", JSON.stringify(baseDatosPrecios));
            cargarListaProductosIndividuales();
        }

        function resetearPrecios() {
            if (confirm("¿Estás seguro de querer borrar todos los aumentos acumulados y volver a los precios originales?")) {
                localStorage.removeItem("preciosPermanentes");
                alert("Precios restaurados a la normalidad.");
                location.reload();
            }
        }
    </script>
</body>
</html>
